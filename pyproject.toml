[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veeshtral"
version = "0.1.2"
description = "Native Veeshtral Python SDK — decorator workflows on the Studio graph engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Veeshtral AI" }]
dependencies = [
  # Pin httpcore/h11 floors so installs cannot resolve CVE-2025-43859 (h11 < 0.16).
  "httpx>=0.27.2,<1",
  "httpcore>=1.0.9,<2",
  "h11>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veeshtral = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
