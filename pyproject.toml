[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veeshtral"
version = "0.1.3"
description = "Native Veeshtral Python SDK — decorator workflows on the Studio graph engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Veeshtral AI" }]
keywords = ["veeshtral", "workflow", "agents", "hitl", "quality-gates"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  # Pin httpcore/h11 floors so installs cannot resolve CVE-2025-43859 (h11 < 0.16).
  "httpx>=0.27.2,<1",
  "httpcore>=1.0.9,<2",
  "h11>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/Veeshtral-AI/veeshtral-sdk"
Documentation = "https://github.com/Veeshtral-AI/veeshtral-sdk#readme"
Repository = "https://github.com/Veeshtral-AI/veeshtral-sdk"
Issues = "https://github.com/Veeshtral-AI/veeshtral-sdk/issues"
Changelog = "https://github.com/Veeshtral-AI/veeshtral-sdk/releases"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veeshtral = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
