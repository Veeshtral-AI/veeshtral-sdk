name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest with coverage
        run: |
          python -m pytest tests -c pytest.ini --rootdir . -v --tb=short \
            --timeout=60 \
            --cov=veeshtral \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-fail-under=80
